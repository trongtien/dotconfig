# kitty — tăng/giảm cỡ chữ (zoom) trong terminal
font_family      JetBrainsMono Nerd Font
font_size        11.0

# Ctrl + = / Ctrl + -  : tăng / giảm cỡ chữ 1pt
# Ctrl + 0             : về cỡ mặc định
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Giữ cả tổ hợp mặc định Ctrl+Shift
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Ctrl + cuộn chuột cũng zoom
mouse_map ctrl+scroll_up   press ungrabbed change_font_size all +1.0
mouse_map ctrl+scroll_down press ungrabbed change_font_size all -1.0
