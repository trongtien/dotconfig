# TODO: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# if folder tmp not exist
# TODO: Change prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# TODO: Setting config theme
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @rose_pine_variant 'moon' 
set -g @rose_pine_host 'on'                  # hiện hostname
set -g @rose_pine_user 'on'                  # hiện username
set -g @rose_pine_directory 'on'             # hiện thư mục hiện tại
set -g @rose_pine_date_time '%H:%M %d-%m'    # định dạng thời gian (có thể tùy chỉnh)
# set -g @rose_pine_bar_bg_disable 'on'      # nếu muốn nền trong suốt

# TODO: Common config
set -g mouse on
set -g status-position top
# Start window/pane numbering from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
# Increase scrollback history
set -g history-limit 10000
# Faster key repeat
set -s escape-time 0

# TODO: Split panes with | and -
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# TODO: Easy pane navigation (Vim style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Seamless C-h/j/k/l: follow vim if pane runs vim/nvim, else move pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(vim|n?vim?x?)(diff)?$'"
bind -n 'C-h' if -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if -F "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize pane khong can prefix: Alt + h/j/k/l (5 cell/nhan)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# Window list: C-a f (thay C-a w mac dinh)
unbind w
bind f choose-tree -Zw
# Reload config with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- TPM phải nằm ở cuối file ---
run '~/.tmux/plugins/tpm/tpm'