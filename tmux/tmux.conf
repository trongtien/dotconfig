# Dựa trên https://github.com/ThePrimeagen/.dotfiles (tmux/.tmux.conf)
set -ga terminal-overrides ",xterm-kitty:RGB"
set -g default-terminal "tmux-256color"
set -s escape-time 0
set -g mouse on

# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g status-style 'bg=#333333 fg=#5eacd3'
set -g base-index 1

# prefix + r: reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Copy mode kiểu vi, y → clipboard (xclip)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Di chuyển pane kiểu vim
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# prefix + f: chọn project bằng tmux-sessionizer
bind -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
