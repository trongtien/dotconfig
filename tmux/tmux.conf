# Dựa trên https://github.com/ThePrimeagen/.dotfiles (tmux/.tmux.conf)
set -ga terminal-overrides ",xterm-kitty:RGB"
set -g default-terminal "tmux-256color"
set -s escape-time 0
set -g mouse on
set -g focus-events on # để nvim nhận FocusGained -> tự load file bị sửa từ ngoài

# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g status-style 'bg=#333333 fg=#5eacd3'
set -g base-index 1

# prefix + r: reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# prefix + R (hoặc , mặc định): đổi tên window, điền sẵn tên hiện tại
bind R command-prompt -I "#W" { rename-window -- "%%" }

# Copy mode kiểu vi, y → clipboard (xclip)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Alt + 1..9: nhảy tới window (không cần prefix), bỏ prefix + 1..9
unbind 0
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Di chuyển pane kiểu vim
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Chia pane kiểu vim, giữ thư mục hiện tại
#   prefix + s: chia trên/dưới (:split)   prefix + v: chia trái/phải (:vsplit)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# danh sách session (mặc định ở s) chuyển sang S
bind S choose-tree -Zs

# prefix + f: chọn project bằng tmux-sessionizer
bind -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
