# DNS toàn cục cho mọi kết nối (Wi-Fi, LAN), bỏ qua DNS nhà mạng cấp qua DHCP.
# Lý do: DNS Viettel/VNPT trả medium.com -> 127.0.0.1 (chặn bằng DNS).
# Áp dụng: sudo install -Dm644 <file> /etc/NetworkManager/conf.d/dns.conf
#          sudo systemctl reload NetworkManager
# Kiểm tra: cat /etc/resolv.conf  (phải thấy nameserver 1.1.1.1)
[global-dns-domain-*]
servers=1.1.1.1,8.8.8.8,2606:4700:4700::1111,2001:4860:4860::8888
