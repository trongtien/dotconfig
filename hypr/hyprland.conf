monitor=,preferred,auto,1

# Auto waybar  conenct hyperland
exec-once = waybar & mako & polkit-kde-agent

$terminal = kitty
$menu =  wofi --show drun 



bind = SUPER, Q, exec, $terminal # Open terminal
bind = SUPER, R, exec, $menu  # Open menu system
bind = SUPER, C, killactive # Close panel active
bind = SUPER, M, exit # Exit close hyperland


input {
	kp_layout = us
	follow_mouse =1 
}
