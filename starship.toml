"$schema" = 'https://starship.rs/config-schema.json'

# perf — keep it fast
scan_timeout = 5
command_timeout = 20
add_newline = false

# rose-pine moon — same palette as tmux theme
format = "[➜ ](bold fg:love)$directory$git_branch"

palette = "rose-pine-moon"

[palettes.rose-pine-moon]
base = '#232136'
surface = '#2a273f'
overlay = '#393552'
muted = '#6e6a86'
subtle = '#908caa'
text = '#e0def4'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ea9a97'
pine = '#3e8fb0'
foam = '#9ccfd8'
iris = '#c4a7e7'

[directory]
style = "bold fg:text"
format = "[$path ]($style)"
truncation_length = 1
truncation_symbol = ""

[git_branch]
symbol = ""
style = "fg:subtle"
format = '[$symbol git:\($branch\)]($style)'

[git_status]
disabled = true